<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¡Feliz Cumpleaños Dani!</title>
<style>
:root {
--bg-kraft: #d8b88d;
--paper-texture: #e8d5b7;
--accent-red: #a83232;
--card-shadow: rgba(0, 0, 0, 0.3);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
user-select: none;
-webkit-user-select: none;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-kraft);
background-image:
radial-gradient(#c29f73 15%, transparent 16%),
radial-gradient(#c29f73 15%, transparent 16%);
background-size: 60px 60px;
background-position: 0 0, 30px 30px;
font-family: 'Courier New', Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow-x: hidden;
padding: 10px;
}

/* Indicador HTTPS / Servidor */
.https-warning {
position: fixed;
top: 10px;
background: rgba(255, 248, 220, 0.95);
border: 2px dashed #b8860b;
padding: 6px 14px;
border-radius: 8px;
font-size: 11px;
color: #5c4033;
z-index: 1000;
text-align: center;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
max-width: 90vw;
}

/* Contenedor Principal de la Tarjeta */
.card-container {
perspective: 2000px;
width: 100%;
max-width: 900px;
height: 85vh;
max-height: 650px;
display: flex;
justify-content: center;
align-items: center;
position: relative;
}

/* Tarjeta Cerrada (Portada) */
.card-closed {
width: 100%;
max-width: 420px;
height: 100%;
position: relative;
cursor: pointer;
transform-style: preserve-3d;
transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 5px 15px 25px var(--card-shadow);
border-radius: 4px;
}

.card-closed:hover {
transform: scale(1.02) rotate(-1deg);
}

.card-closed img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 4px;
display: block;
}

/* Doble Página (Abierta) */
.card-opened {
display: none;
width: 100%;
height: 100%;
position: relative;
flex-direction: row;
box-shadow: 0 15px 35px var(--card-shadow);
border-radius: 6px;
overflow: hidden;
background-color: #f7ede2;
animation: openBook 0.8s ease-out forwards;
}

@keyframes openBook {
0% { transform: scale(0.8) rotateY(-20deg); opacity: 0; }
100% { transform: scale(1) rotateY(0deg); opacity: 1; }
}

.page {
flex: 1;
height: 100%;
position: relative;
overflow: hidden;
background-size: cover;
background-position: center;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

.page-left {
border-right: 2px solid rgba(0, 0, 0, 0.15);
background-color: #f2e3c9;
}

.page-right {
background-color: #f5ebd8;
}

/* PÁGINA IZQUIERDA: CARTA Y SOBRE */
.envelope-wrapper {
position: relative;
width: 90%;
height: 85%;
display: flex;
justify-content: center;
align-items: center;
}

.envelope-bg {
width: 100%;
height: 100%;
object-fit: contain;
position: absolute;
z-index: 1;
}

/* Carta Interactiva */
.letter-interactive {
position: absolute;
width: 65%;
height: 70%;
top: 15%;
left: 17%;
z-index: 2;
cursor: pointer;
transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
box-shadow: 0 4px 10px rgba(0,0,0,0.2);
border-radius: 2px;
background: white;
overflow: hidden;
}

.letter-interactive img {
width: 100%;
height: 100%;
object-fit: cover;
}

/* Carta en Primer Plano (Extraída) */
.letter-interactive.extracted {
position: fixed;
top: 50% !important;
left: 50% !important;
transform: translate(-50%, -50%) scale(1.35) !important;
width: 80vw !important;
max-width: 450px !important;
height: 80vh !important;
max-height: 600px !important;
z-index: 999 !important;
box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.letter-overlay {
display: none;
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.5);
z-index: 998;
backdrop-filter: blur(2px);
}

.letter-overlay.active {
display: block;
}

/* PÁGINA DERECHA: TARTA Y VELAS */
.cake-container {
position: relative;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
}

.cake-bg {
width: 100%;
height: 100%;
object-fit: contain;
position: absolute;
}

/* Llamas de las velas */
.flame {
position: absolute;
width: 18px;
height: 32px;
background: radial-gradient(ellipse at bottom, #fff 10%, #ffd700 40%, #ff4500 80%, transparent 100%);
border-radius: 50% 50% 20% 20%;
filter: drop-shadow(0 0 6px #ff8c00);
transform-origin: center bottom;
animation: flicker 0.15s infinite alternate ease-in-out;
opacity: 1;
transition: transform 0.1s ease-out, opacity 0.4s ease;
z-index: 10;
}

@keyframes flicker {
0% { transform: scale(1) rotate(-2deg); }
100% { transform: scale(1.08) rotate(2deg); }
}

/* Posiciones exactas sobre las 4 velas de la imagen */
.flame-1 { top: 51.5%; left: 22.5%; }
.flame-2 { top: 50.8%; left: 40.5%; }
.flame-3 { top: 58.2%; left: 58.5%; }
.flame-4 { top: 51.2%; left: 73.5%; }

/* PARTE CONTROLES Y BOTONES */
.ui-controls {
position: fixed;
bottom: 12px;
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
z-index: 100;
width: 100%;
padding: 0 10px;
}

.btn-scrapbook {
background: #f4e8c1;
border: 2px solid #5c4033;
color: #3d2314;
padding: 10px 18px;
font-family: inherit;
font-weight: bold;
font-size: 14px;
border-radius: 25px;
cursor: pointer;
box-shadow: 3px 3px 0px #5c4033;
transition: all 0.1s ease;
display: flex;
align-items: center;
gap: 6px;
}

.btn-scrapbook:active {
transform: translate(2px, 2px);
box-shadow: 1px 1px 0px #5c4033;
}

/* Indicador de Micrófono */
.mic-indicator-box {
display: flex;
align-items: center;
gap: 6px;
background: rgba(255,255,255,0.85);
border: 2px solid #5c4033;
padding: 4px 12px;
border-radius: 20px;
font-size: 12px;
box-shadow: 2px 2px 0px #5c4033;
}

.mic-bar-bg {
width: 50px;
height: 10px;
background: #ddd;
border-radius: 5px;
overflow: hidden;
border: 1px solid #777;
}

.mic-bar-fill {
width: 0%;
height: 100%;
background: #4caf50;
transition: width 0.05s ease;
}

/* Mensaje "Pide un deseo, Dani" */
.wish-modal {
display: none;
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%) scale(0.5);
background: #fffdf5;
border: 4px dashed #a83232;
padding: 25px 35px;
border-radius: 15px;
text-align: center;
z-index: 1001;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes popIn {
100% { transform: translate(-50%, -50%) scale(1); }
}

.wish-modal h2 {
color: #a83232;
font-size: 28px;
margin-bottom: 10px;
font-family: 'Comic Sans MS', cursive, sans-serif;
}

canvas#confetti-canvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 1000;
}

/* Adaptabilidad Móvil / Tablet */
@media (max-width: 768px) {
.card-container {
height: 75vh;
}
.card-opened {
flex-direction: column;
}
.page-left {
border-right: none;
border-bottom: 2px solid rgba(0,0,0,0.15);
}
.btn-scrapbook {
padding: 8px 12px;
font-size: 12px;
}
.flame {
width: 14px;
height: 24px;
}
}
</style>
</head>
<body>

<!-- Advertencia HTTPS -->
<div class="https-warning">
💡 Para soplar con el micrófono abre mediante HTTPS. Si estás en local, usa el botón "Mantén pulsado para soplar".
</div>

<canvas id="confetti-canvas"></canvas>
<div class="letter-overlay" id="letterOverlay"></div>

<!-- Contenedor Principal de la Tarjeta -->
<div class="card-container">

<!-- PORTADA (Cerrada) -->
<div class="card-closed" id="cardClosed" onclick="openCard()">
<img src="1000012222.png" alt="Portada Cumpleaños Dani">span_0span_0
</div>

<!-- DOBLE PÁGINA (Abierta) -->
<div class="card-opened" id="cardOpened">

<!-- Página Izquierda: Carta y Sobre -->
<div class="page page-left">
<div class="envelope-wrapper">
<img src="1000012223.png" class="envelope-bg" alt="Sobre con carta">span_1span_1
<div class="letter-interactive" id="interactiveLetter" onclick="toggleLetter()">
<img src="1000012224.png" alt="Carta para Dani">span_2span_2
</div>
</div>
</div>

<!-- Página Derecha: Tarta y Velas -->
<div class="page page-right">
<div class="cake-container">
<img src="1000012225.png" class="cake-bg" alt="Tarta de cumpleaños">span_3span_3

<!-- Velas Independientes -->
<div class="flame flame-1" id="flame1"></div>
<div class="flame flame-2" id="flame2"></div>
<div class="flame flame-3" id="flame3"></div>
<div class="flame flame-4" id="flame4"></div>
</div>
</div>

</div>
</div>

<!-- Controles e Interfaz inferior -->
<div class="ui-controls" id="uiControls" style="display: none;">
<button class="btn-scrapbook" onclick="closeCard()">⬅ Volver a la portada</button>

<div class="mic-indicator-box">
<span>🎤 Mic:</span>
<div class="mic-bar-bg">
<div class="mic-bar-fill" id="micLevel"></div>
</div>
</div>

<button class="btn-scrapbook" id="blowBtn" onmousedown="startBlowing()" onmouseup="stopBlowing()" onmouseleave="stopBlowing()" ontouchstart="startBlowing()" ontouchend="stopBlowing()">
💨 Mantén pulsado para soplar
</button>

<button class="btn-scrapbook" id="rekindleBtn" onclick="rekindleCandles()" style="display: none;">
🔥 Volver a encender
</button>
</div>

<!-- Mensaje de Deseo al Apagar -->
<div class="wish-modal" id="wishModal">
<h2>✨ ¡Pide un deseo, Dani! ✨</h2>
<p>¡Que todos tus sueños se cumplan este año!</p>
<br>
<button class="btn-scrapbook" style="margin: 0 auto;" onclick="closeWishModal()">Continuar</button>
</div>

<script>
// ESTADOS Y VARIABLES
let isOpened = false;
let isLetterExtracted = false;
let candlesLit = true;
let blowTimer = null;
let blowProgress = 0;

// Web Audio API
let audioContext = null;
let analyser = null;
let microphone = null;
let javascriptNode = null;

// ABRIR Y CERRAR TARJETA
function openCard() {
document.getElementById('cardClosed').style.display = 'none';
document.getElementById('cardOpened').style.display = 'flex';
document.getElementById('uiControls').style.display = 'flex';
isOpened = true;
initMicrophone();
}

function closeCard() {
if (isLetterExtracted) toggleLetter();
document.getElementById('cardClosed').style.display = 'block';
document.getElementById('cardOpened').style.display = 'none';
document.getElementById('uiControls').style.display = 'none';
isOpened = false;
}

// INTERACCIÓN CARTA
function toggleLetter() {
const letter = document.getElementById('interactiveLetter');
const overlay = document.getElementById('letterOverlay');

isLetterExtracted = !isLetterExtracted;
if (isLetterExtracted) {
letter.classList.add('extracted');
overlay.classList.add('active');
} else {
letter.classList.remove('extracted');
overlay.classList.remove('active');
}
}

document.getElementById('letterOverlay').addEventListener('click', () => {
if (isLetterExtracted) toggleLetter();
});

// SISTEMA DE SOPLIDO Y MICRÓFONO
async function initMicrophone() {
if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
return;
}

try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
audioContext = new (window.AudioContext || window.webkitAudioContext)();
analyser = audioContext.createAnalyser();
microphone = audioContext.createMediaStreamSource(stream);

analyser.fftSize = 256;
microphone.connect(analyser);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

function checkAudio() {
if (!candlesLit || !isOpened) {
requestAnimationFrame(checkAudio);
return;
}

analyser.getByteFrequencyData(dataArray);

// Calculamos volumen general y componente de frecuencia (ruido blanco típico del soplido)
let sum = 0;
for (let i = 0; i < bufferLength; i++) {
sum += dataArray[i];
}
let average = sum / bufferLength;

// Actualizar barra visual del micrófono
const micFill = document.getElementById('micLevel');
if (micFill) {
micFill.style.width = Math.min(100, average * 2) + '%';
}

// Detección de soplido: Volumen sostenido con presencia de frecuencias medias-altas
if (average > 35) {
reactToBlowing(true);
blowProgress += 0.05;
if (blowProgress >= 1.0) {
extinguishCandles();
}
} else {
reactToBlowing(false);
blowProgress = Math.max(0, blowProgress - 0.05);
}

requestAnimationFrame(checkAudio);
}

checkAudio();

} catch (err) {
console.log('Micrófono no disponible o denegado, utilizando modo manual/botón.');
}
}

// REACCIÓN VISUAL DE LAS LLAMAS AL SOPLAR
function reactToBlowing(isBlowing) {
const flames = document.querySelectorAll('.flame');
flames.forEach(flame => {
if (isBlowing) {
const skewAngle = Math.random() * 20 + 10;
flame.style.transform = scale(0.8, 1.2) rotate(${skewAngle}deg);
} else {
flame.style.transform = 'scale(1) rotate(0deg)';
}
});
}

// BOTÓN / BARRA ESPACIADORA DE SOPLADO MANUAL
function startBlowing() {
if (!candlesLit) return;
reactToBlowing(true);
blowTimer = setInterval(() => {
blowProgress += 0.1;
if (blowProgress >= 1.0) {
extinguishCandles();
stopBlowing();
}
}, 50);
}

function stopBlowing() {
clearInterval(blowTimer);
blowProgress = 0;
reactToBlowing(false);
}

// Atajo barra espaciadora
window.addEventListener('keydown', (e) => {
if (e.code === 'Space' && !e.repeat && isOpened) {
startBlowing();
}
});

window.addEventListener('keyup', (e) => {
if (e.code === 'Space' && isOpened) {
stopBlowing();
}
});

// APAGAR VELAS
function extinguishCandles() {
candlesLit = false;
const flames = document.querySelectorAll('.flame');
flames.forEach(flame => {
flame.style.opacity = '0';
});

document.getElementById('rekindleBtn').style.display = 'inline-flex';
document.getElementById('blowBtn').style.display = 'none';

setTimeout(() => {
triggerConfetti();
document.getElementById('wishModal').style.display = 'block';
}, 300);
}

// VOLVER A ENCENDER VELAS
function rekindleCandles() {
candlesLit = true;
blowProgress = 0;
const flames = document.querySelectorAll('.flame');
flames.forEach(flame => {
flame.style.opacity = '1';
flame.style.transform = 'scale(1) rotate(0deg)';
});

document.getElementById('rekindleBtn').style.display = 'none';
document.getElementById('blowBtn').style.display = 'inline-flex';
}

function closeWishModal() {
document.getElementById('wishModal').style.display = 'none';
}

// ANIMACIÓN DE CONFETI EN CANVAS VANILLA
function triggerConfetti() {
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const pieces = [];
const numberOfPieces = 120;
const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];

for (let i = 0; i < numberOfPieces; i++) {
pieces.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height - canvas.height,
size: Math.random() * 10 + 5,
color: colors[Math.floor(Math.random() * colors.length)],
speed: Math.random() * 5 + 2,
rotation: Math.random() * 360,
rotationSpeed: Math.random() * 10 - 5
});
}

let animationFrame;
function render() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
pieces.forEach((p) => {
p.y += p.speed;
p.rotation += p.rotationSpeed;
ctx.save();
ctx.translate(p.x, p.y);
ctx.rotate((p.rotation * Math.PI) / 180);
ctx.fillStyle = p.color;
ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
ctx.restore();
});

if (pieces.some(p => p.y < canvas.height)) {
animationFrame = requestAnimationFrame(render);
} else {
ctx.clearRect(0, 0, canvas.width, canvas.height);
cancelAnimationFrame(animationFrame);
}
}

render();
}
</script>
</body>
</html>
